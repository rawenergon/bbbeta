<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Terminal</title>
	<meta name="nova-include" content="nova.css material-symbols-rounded">
	<meta name="permissions" content="unsandboxed, fileGet, fileSet, settings">
	<meta name="nova-icon" content="<svg width='232' height='232' viewBox='0 0 232 232' fill='none' xmlns='http://www.w3.org/2000/svg'><rect width='232' height='232' rx='48' fill='#111827'/><rect x='43' y='57' width='146' height='118' rx='16' fill='#DCFCE7'/><path d='M72 96l24 20-24 20M105 139h52' stroke='#111827' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/></svg>">
	<style>
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; background: #0b1017; color: #d7ffe5; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; overflow: hidden; }
		.shell { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
		header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; background: #101820; border-bottom: 1px solid #24372f; }
		.title { display: flex; align-items: center; gap: 8px; font-weight: 700; }
		.status { color: #87d9a6; font-size: 12px; opacity: .86; }
		#log { padding: 14px; overflow: auto; white-space: pre-wrap; line-height: 1.55; }
		.line { display: block; margin-bottom: 2px; }
		.promptline { color: #9ef5bd; }
		.error { color: #ff8c9a; }
		.muted { color: #93a89b; }
		.good { color: #6ee7a0; }
		form { display: grid; grid-template-columns: auto 1fr; gap: 8px; padding: 10px; border-top: 1px solid #24372f; background: #101820; }
		input { min-width: 0; background: transparent; border: 0; outline: 0; color: #d7ffe5; font: inherit; }
		.prompt { color: #70e09b; }
	</style>
</head>

<body>
	<div class="shell">
		<header>
			<div class="title"><span class="material-symbols-rounded">terminal</span>BB OS Terminal</div>
			<div class="status" id="status">ready</div>
		</header>
		<div id="log"></div>
		<form id="form">
			<span class="prompt" id="prompt">bbos:/Desktop&gt;</span>
			<input id="cmd" autocomplete="off" autofocus spellcheck="false">
		</form>
	</div>
	<script>
		const log = document.getElementById("log");
		const cmd = document.getElementById("cmd");
		const status = document.getElementById("status");
		const prompt = document.getElementById("prompt");
		let cwd = "Desktop/";
		let history = JSON.parse(localStorage.getItem("bbos.terminal.history") || "[]");
		let historyIndex = history.length;

		const commandNames = ["help", "pwd", "ls", "dir", "cd", "cat", "open", "apps", "files", "mkdir", "touch", "write", "rm", "date", "whoami", "theme", "note", "storage", "clear", "about"];

		function escapeText(text) {
			return String(text).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
		}

		function print(text = "", className = "") {
			const line = document.createElement("span");
			line.className = `line ${className}`.trim();
			line.innerHTML = escapeText(text);
			log.appendChild(line);
			log.scrollTop = log.scrollHeight;
		}

		function setStatus(text) {
			status.textContent = text;
			setTimeout(() => status.textContent = "ready", 1600);
		}

		function parentCall(name, ...args) {
			const api = window.parent && window.parent[name];
			if (typeof api !== "function") throw new Error(`${name} is not available`);
			return api(...args);
		}

		function normalizeFolder(path = cwd) {
			let raw = String(path || cwd).trim();
			if (raw === "/" || raw === "") return "";
			raw = raw.replace(/\\/g, "/");
			const parts = raw.startsWith("/") ? [] : cwd.split("/").filter(Boolean);
			for (const part of raw.split("/")) {
				if (!part || part === ".") continue;
				if (part === "..") parts.pop();
				else parts.push(part);
			}
			return parts.length ? parts.join("/") + "/" : "";
		}

		function resolvePath(path = "") {
			const raw = String(path || "").replace(/\\/g, "/").trim();
			if (!raw || raw === ".") return { folder: cwd, name: "" };
			if (raw.endsWith("/") || raw === ".." || raw === "/") return { folder: normalizeFolder(raw), name: "" };
			const base = raw.startsWith("/") ? "" : cwd;
			const parts = (base + raw).split("/").filter(Boolean);
			const name = parts.pop() || "";
			return { folder: parts.length ? parts.join("/") + "/" : "", name };
		}

		function updatePrompt() {
			prompt.textContent = `bbos:/${cwd || ""}>`;
		}

		function decodeContent(content) {
			if (!content) return "";
			if (content.startsWith("data:")) {
				const comma = content.indexOf(",");
				const meta = content.slice(0, comma);
				const payload = content.slice(comma + 1);
				if (meta.includes(";base64")) {
					try { return decodeURIComponent(escape(atob(payload))); } catch { return atob(payload); }
				}
				return decodeURIComponent(payload);
			}
			try { return atob(content); } catch { return content; }
		}

		async function listFolder(folder = cwd) {
			const normalized = normalizeFolder(folder);
			const files = await parentCall("getFileNamesByFolder", normalized);
			if (!files || files.length === 0) return `${normalized || "/"} is empty.`;
			return files.map(file => `${file.id ? "file" : "dir "}  ${file.name}`).join("\n");
		}

		async function changeDir(path) {
			const next = normalizeFolder(path || "");
			await parentCall("getFileNamesByFolder", next);
			cwd = next;
			updatePrompt();
			return `/${cwd}`;
		}

		async function catFile(path) {
			if (!path) return "Usage: cat file.txt";
			const { folder, name } = resolvePath(path);
			const files = await parentCall("getFileNamesByFolder", folder);
			const item = files.find(file => file.name.toLowerCase() === name.toLowerCase());
			if (!item?.id) return `No file: ${path}`;
			const file = await parentCall("getFileById", item.id);
			return decodeContent(file.content).slice(0, 8000);
		}

		async function openTarget(path) {
			if (!path) return "Usage: open browser OR open file.txt";
			const appName = path.toLowerCase().replace(/\s+/g, "");
			const apps = await parentCall("getFileNamesByFolder", "Apps");
			const app = apps.find(file => file.name.toLowerCase() === `${appName}.app` || file.name.toLowerCase() === appName);
			if (app?.id) {
				await parentCall("openfile", app.id);
				return `Opening ${app.name}...`;
			}
			const { folder, name } = resolvePath(path);
			const files = await parentCall("getFileNamesByFolder", folder);
			const file = files.find(item => item.name.toLowerCase() === name.toLowerCase());
			if (!file?.id) return `No app or file: ${path}`;
			await parentCall("openfile", file.id);
			return `Opening ${file.name}...`;
		}

		async function makeFolder(path) {
			if (!path) return "Usage: mkdir folder";
			const next = normalizeFolder(path);
			await parentCall("createFolder", next);
			return `Created /${next}`;
		}

		async function touchFile(name) {
			if (!name) return "Usage: touch file.txt";
			const { folder, name: fileName } = resolvePath(name);
			await parentCall("createFile", folder, fileName, fileName.split(".").pop() || "txt", "");
			return `Created ${fileName}`;
		}

		async function writeFile(args) {
			if (args.length < 2) return "Usage: write file.txt hello world";
			const target = args.shift();
			const { folder, name } = resolvePath(target);
			await parentCall("createFile", folder, name, name.split(".").pop() || "txt", args.join(" "));
			return `Wrote ${name}`;
		}

		async function removeFile(path) {
			if (!path) return "Usage: rm file.txt";
			const { folder, name } = resolvePath(path);
			const files = await parentCall("getFileNamesByFolder", folder);
			const file = files.find(item => item.name.toLowerCase() === name.toLowerCase());
			if (!file?.id) return `No file: ${path}`;
			await parentCall("remfile", file.id);
			return `Removed ${file.name}`;
		}

		function storageInfo() {
			let used = 0;
			for (let i = 0; i < localStorage.length; i++) {
				const key = localStorage.key(i);
				used += key.length + String(localStorage.getItem(key)).length;
			}
			return `Local browser storage: ${(used / 1024).toFixed(1)} KB used by this origin.`;
		}

		const commands = {
			help: async () => [
				"Commands:",
				"  pwd                       Print current BB OS folder",
				"  ls / dir [folder]          List files",
				"  cd <folder>                Change folder, example: cd Downloads",
				"  cat <file>                 Print a text file",
				"  open <app|file>            Open app or file",
				"  mkdir <folder>             Create folder",
				"  touch <file>               Create empty file",
				"  write <file> <text>         Write text file",
				"  rm <file>                  Remove file",
				"  apps                       List installed apps",
				"  date, whoami, theme, storage, clear"
			].join("\n"),
			pwd: async () => `/${cwd}`,
			ls: args => listFolder(args[0] || cwd),
			dir: args => listFolder(args[0] || cwd),
			cd: args => changeDir(args[0] || "/"),
			cat: args => catFile(args.join(" ")),
			open: args => openTarget(args.join(" ")),
			apps: () => listFolder("Apps"),
			files: args => listFolder(args[0] || cwd),
			mkdir: args => makeFolder(args.join(" ")),
			touch: args => touchFile(args.join(" ")),
			write: args => writeFile([...args]),
			rm: args => removeFile(args.join(" ")),
			date: async () => new Date().toString(),
			whoami: async () => window.parent.CurrentUsername || "Guest",
			theme: async () => `Wallpaper: ${(await parentCall("getSetting", "wall").catch(() => "")) ? "custom" : "default"}`,
			note: args => writeFile([`Terminal-Note-${Date.now()}.txt`, ...args]),
			storage: async () => storageInfo(),
			about: async () => "BB OS Terminal navigates the same virtual files used by the Files app."
		};

		async function runCommand(raw) {
			const parts = raw.trim().split(/\s+/);
			const name = (parts.shift() || "").toLowerCase();
			if (!name) return;
			print(`${prompt.textContent} ${raw}`, "promptline");
			if (name === "clear") {
				log.innerHTML = "";
				return;
			}
			const handler = commands[name];
			if (!handler) {
				print(`Unknown command: ${name}. Type help.`, "error");
				return;
			}
			try {
				setStatus("working");
				print(await handler(parts), "good");
			} catch (error) {
				print(error.message || String(error), "error");
			}
		}

		document.getElementById("form").onsubmit = async event => {
			event.preventDefault();
			const value = cmd.value.trim();
			if (!value) return;
			history.push(value);
			history = history.slice(-80);
			localStorage.setItem("bbos.terminal.history", JSON.stringify(history));
			historyIndex = history.length;
			cmd.value = "";
			await runCommand(value);
		};

		cmd.addEventListener("keydown", event => {
			if (event.key === "ArrowUp") {
				event.preventDefault();
				historyIndex = Math.max(0, historyIndex - 1);
				cmd.value = history[historyIndex] || "";
			}
			if (event.key === "ArrowDown") {
				event.preventDefault();
				historyIndex = Math.min(history.length, historyIndex + 1);
				cmd.value = history[historyIndex] || "";
			}
			if (event.key === "Tab") {
				event.preventDefault();
				const first = cmd.value.split(/\s+/)[0].toLowerCase();
				const match = commandNames.find(name => name.startsWith(first));
				if (match) cmd.value = match + (cmd.value.includes(" ") ? cmd.value.slice(first.length) : " ");
			}
		});

		updatePrompt();
		print("BB OS Terminal", "good");
		print("Try: pwd, ls, cd Downloads, cat Welcome.html, open files", "muted");
		cmd.focus();
	</script>
</body>

</html>
