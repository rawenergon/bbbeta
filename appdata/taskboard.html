<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Task Board</title>
	<meta name="nova-include" content="nova.css material-symbols-rounded">
	<meta name="nova-icon" content="<svg width='232' height='232' viewBox='0 0 232 232' fill='none' xmlns='http://www.w3.org/2000/svg'><rect width='232' height='232' rx='48' fill='#314D3C'/><rect x='46' y='58' width='39' height='116' rx='12' fill='#DDF6E8'/><rect x='96' y='58' width='39' height='116' rx='12' fill='#8BE0B0'/><rect x='146' y='58' width='39' height='116' rx='12' fill='#F7D66D'/><path d='M56 82h19M106 82h19M156 82h19M56 106h19M106 106h19M156 106h19' stroke='#314D3C' stroke-width='8' stroke-linecap='round'/></svg>">
	<style>
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; background: var(--col-bg1); color: var(--col-txt1); font-family: var(--font); overflow: hidden; }
		.shell { height: 100%; display: grid; grid-template-rows: auto 1fr; }
		header { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px; background: var(--col-bg2); border-bottom: 1px solid color-mix(in srgb, var(--col-txt1) 12%, transparent); }
		input, button { border: 1px solid color-mix(in srgb, var(--col-txt1) 12%, transparent); border-radius: 8px; background: var(--col-bg1); color: inherit; min-height: 36px; padding: 0 10px; font: inherit; }
		button { background: color-mix(in srgb, var(--colors-accent) 22%, var(--col-bg2)); cursor: pointer; }
		.board { min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); gap: 10px; padding: 10px; overflow: auto; }
		.column { min-height: 220px; background: color-mix(in srgb, var(--col-bg2) 72%, transparent); border: 1px solid color-mix(in srgb, var(--col-txt1) 10%, transparent); border-radius: 8px; padding: 10px; }
		h3 { margin: 0 0 10px; font-size: 14px; }
		.card { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; background: color-mix(in srgb, var(--col-txt1) 7%, transparent); border-radius: 8px; padding: 9px; margin-bottom: 8px; }
		.card button { min-height: 28px; padding: 0 8px; }
	</style>
</head>

<body>
	<div class="shell">
		<header>
			<input id="task" placeholder="Add a project task">
			<button id="add">Add</button>
		</header>
		<div id="board" class="board"></div>
	</div>
	<script>
		const columns = ["Todo", "Doing", "Done"];
		const board = document.getElementById("board");
		const task = document.getElementById("task");
		let data = JSON.parse(localStorage.getItem("bbos.taskboard") || '{"Todo":[],"Doing":[],"Done":[]}');

		function save() { localStorage.setItem("bbos.taskboard", JSON.stringify(data)); }
		function move(text, from) {
			const next = columns[Math.min(columns.indexOf(from) + 1, columns.length - 1)];
			data[from] = data[from].filter(item => item !== text);
			data[next].push(text);
			save();
			render();
		}
		function render() {
			board.innerHTML = "";
			columns.forEach(column => {
				const section = document.createElement("section");
				section.className = "column";
				section.innerHTML = `<h3>${column}</h3>`;
				data[column].forEach(text => {
					const card = document.createElement("div");
					card.className = "card";
					card.innerHTML = `<span>${text}</span><button>${column === "Done" ? "Clear" : "Next"}</button>`;
					card.querySelector("button").onclick = () => {
						if (column === "Done") data.Done = data.Done.filter(item => item !== text);
						else move(text, column);
						save();
						render();
					};
					section.appendChild(card);
				});
				board.appendChild(section);
			});
		}
		document.getElementById("add").onclick = () => {
			if (!task.value.trim()) return;
			data.Todo.push(task.value.trim());
			task.value = "";
			save();
			render();
		};
		task.addEventListener("keydown", event => { if (event.key === "Enter") document.getElementById("add").click(); });
		render();
	</script>
</body>

</html>
