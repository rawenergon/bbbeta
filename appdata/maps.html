<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="nova-include" content="nova.css material-symbols-rounded">
	<meta name="permissions" content="unsandboxed">
	<meta name="nova-icon" content="<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><rect width='48' height='48' rx='12' fill='#1f9d55'/><path d='M12 14l8-3 8 3 8-3v23l-8 3-8-3-8 3z' fill='#fff'/><path d='M20 11v23M28 14v23' stroke='#1f9d55' stroke-width='2'/><circle cx='24' cy='24' r='5' fill='#2f6df6'/></svg>">
	<meta name="nova-aspectratio" content="12/7">
	<title>Maps</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; height: 100vh; background: var(--col-bg1); color: var(--col-txt1); font-family: inherit; display: flex; flex-direction: column; }
		header { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px; background: var(--col-bg2); border-bottom: 1px solid var(--col-bg3); }
		input { flex: 1; border: 1px solid var(--col-bg3); border-radius: 8px; padding: 10px; background: var(--col-bg1); color: inherit; }
		button { border: 0; border-radius: 8px; padding: 0 14px; background: var(--colors-accent); color: white; cursor: pointer; }
		#status { grid-column: 1 / -1; min-height: 18px; font-size: 12px; opacity: .72; }
		iframe { flex: 1; width: 100%; border: 0; background: #ddd; }
	</style>
</head>
<body>
	<header>
		<input id="query" placeholder="Search OpenStreetMap">
		<button onclick="searchMap()">Search</button>
		<div id="status">Showing Mumbai region. Search keeps the map embedded.</div>
	</header>
	<iframe id="map" title="OpenStreetMap" src="https://www.openstreetmap.org/export/embed.html?bbox=72.77%2C18.89%2C72.98%2C19.18&amp;layer=mapnik"></iframe>
	<script>
		function setMap(lat, lon, label) {
			const delta = 0.04;
			const bbox = [lon - delta, lat - delta, lon + delta, lat + delta].join("%2C");
			document.getElementById("map").src = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat}%2C${lon}`;
			document.getElementById("status").textContent = label;
		}

		async function searchMap() {
			const query = document.getElementById("query").value.trim();
			if (!query) return;
			const status = document.getElementById("status");
			status.textContent = "Searching...";
			try {
				const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
				const results = await response.json();
				if (!results.length) {
					status.textContent = "No place found. Try a city, landmark, or address.";
					return;
				}
				const place = results[0];
				setMap(Number(place.lat), Number(place.lon), place.display_name);
			} catch (error) {
				status.textContent = "Search is unavailable right now. The embedded map still works.";
			}
		}
		document.getElementById("query").addEventListener("keydown", event => {
			if (event.key === "Enter") searchMap();
		});
	</script>
</body>
</html>
